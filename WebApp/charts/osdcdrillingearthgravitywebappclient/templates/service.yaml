apiVersion: v1
kind: Service
metadata:
  name: {{ include "earthgravitywebapp.fullname" . }}
  labels: {{- include "earthgravitywebapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector: {{- include "earthgravitywebapp.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
