apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "earthgravitywebapp.fullname" . }}
  labels: {{- include "earthgravitywebapp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "earthgravitywebapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "earthgravitywebapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "earthgravitywebapp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: EarthGravityHostURL, value: {{ .Values.configuration.earthGravityHostURL | quote }} }
            - { name: UnitConversionHostURL, value: {{ .Values.configuration.unitConversionHostURL | quote }} }
          ports:
            - { name: http, containerPort: 8080 }
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet: { path: /EarthGravity/webapp/health/ready, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /EarthGravity/webapp/health/live, port: http }
            initialDelaySeconds: 10
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data-protection, mountPath: /home/app/.aspnet/DataProtection-Keys }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-protection
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
