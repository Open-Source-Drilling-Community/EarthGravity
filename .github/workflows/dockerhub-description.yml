name: Update Docker Hub Description

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-hub-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update service description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: digiwells/osdcdrillingearthgravityservice
          readme-filepath: ./Service/README.md
      - name: Update WebApp description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: digiwells/osdcdrillingearthgravitywebappclient
          readme-filepath: ./WebApp/README.md
