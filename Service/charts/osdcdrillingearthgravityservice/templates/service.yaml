apiVersion: v1
kind: Service
metadata:
  name: {{ include "earthgravityservice.fullname" . }}
  labels: {{- include "earthgravityservice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "earthgravityservice.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
