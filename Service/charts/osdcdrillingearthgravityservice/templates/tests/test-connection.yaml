apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "earthgravityservice.fullname" . }}-test-connection"
  labels:
    {{- include "earthgravityservice.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args: ["{{ include "earthgravityservice.fullname" . }}:{{ .Values.service.port }}/EarthGravity/api/health/live"]
  restartPolicy: Never
